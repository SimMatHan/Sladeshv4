<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/ikon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Uden `theme_color` i manifestet OG her bliver statuslinjen hvid paa
         Android, mens appen er moerk. De to vaerdier skal folges ad. -->
    <meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />

    <!-- iOS laeser stadig ikke manifestets `display`. Uden de to her aabner
         appen i Safari med adresselinje, ogsaa fra hjemmeskaermen.
         `black-translucent` lader indholdet gaa op under statuslinjen, hvilket
         er hele pointen med viewport-fit=cover nedenfor. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sladesh" />

    <!-- `interactive-widget=resizes-content` faar tastaturet til at skubbe
         indholdet op i stedet for at lægge sig hen over den faste skriver
         i chatten. `viewport-fit=cover` giver env(safe-area-inset-*) vaerdier
         paa telefoner med hak. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>SladeshApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
