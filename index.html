<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/ikon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Uden `theme_color` i manifestet OG her bliver statuslinjen hvid paa
         Android, mens appen er moerk. De to vaerdier skal folges ad. -->
    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2eee4" media="(prefers-color-scheme: light)" />

    <!-- iOS laeser stadig ikke manifestets `display`. Uden de to her aabner
         appen i Safari med adresselinje, ogsaa fra hjemmeskaermen.
         `black-translucent` lader indholdet gaa op under statuslinjen, hvilket
         er hele pointen med viewport-fit=cover nedenfor. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sladesh" />

    <!--
      `interactive-widget=resizes-content` STOD HER OG ER FJERNET.

      Den bad browseren om at KRYMPE layout-viewporten, naar tastaturet kom
      op, saa indholdet blev skubbet op i stedet for at faa tastaturet ned
      over sig. Den blev skrevet ind for Android, og kommentaren her paastod,
      at iOS bare ignorerede den.

      Det gjorde iOS engang. Nyere iOS foelger den — og det er dét, der var
      galt. Maalt paa en iPhone 15 Pro laa hele den faste bundklynge 60 px
      for hoejt, EFTER tastaturet var gaaet ned: layout-viewporten var stadig
      krympet, fordi tilbehoersbjaelken over tastaturet hoerer til FOKUS og
      ikke til tastaturet. `position: fixed` regner fra layout-viewporten, saa
      baade skriveren og navigationen rykkede med.

      Uden linjen laegger tastaturet sig OVEN PAA igen, layout-viewporten
      roeres ikke, og der er ingen krympning at give tilbage. At loefte
      skriveren fri af tastaturet er saa vores eget arbejde — og det er
      allerede skrevet: `--tastatur` i src/ui/tastatur.ts maaler
      `visualViewport` og goer praecis det. Den kode har hidtil ikke haft
      noget at lave paa iOS, netop fordi denne linje stod her.

      Det giver ogsaa ÉN model paa tvaers af platforme frem for to: vi
      loefter selv, i stedet for at bede hver browser om at goere noget lidt
      forskelligt.

      `viewport-fit=cover` bliver — den giver env(safe-area-inset-*) paa
      telefoner med hak og har intet med tastaturet at goere.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SladeshApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
