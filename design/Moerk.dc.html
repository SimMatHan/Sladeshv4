<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: #f59e0b; } a:hover { color: #d97706; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6b7280; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #08090c; color: #f2f3f5; overflow: hidden; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 12px 16px;">
    <div style="width: 42px; height: 42px; border-radius: 999px; background: linear-gradient(150deg, #f59e0b, #d97706); display: grid; place-items: center; font-size: 20px;">🦈</div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 17px; font-weight: 550; letter-spacing: -0.01em;">Simon</div>
      <div style="font-size: 13px; color: #6b7280;">Ballade · fredag</div>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ba1ad" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0 16px;">

    <!-- HERO -->
    <div style="background: #14161b; border: 1px solid #23262f; border-radius: 22px; padding: 20px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div class="lab">I aften</div>
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <div class="num" style="font-size: 56px; font-weight: 700; line-height: 1;">7</div>
            <div style="font-size: 17px; color: #9ba1ad;">genstande</div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
          <div class="lab">Promille</div>
          <div class="num" style="font-size: 28px; font-weight: 700; color: #f59e0b; line-height: 1;">0,82</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px;">
        <div style="height: 6px; border-radius: 999px; background: #23262f; position: relative; overflow: hidden;">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 58%; border-radius: 999px; background: linear-gradient(90deg, #d97706, #f59e0b);"></div>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <div style="font-size: 13px; color: #6b7280;">Sidste for 24 min siden</div>
          <div style="font-size: 13px; color: #6b7280;">3 til Full Bender</div>
        </div>
      </div>
    </div>

    <!-- STIME -->
    <div style="background: #14161b; border: 1px solid #23262f; border-radius: 22px; padding: 20px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px;">
          <div style="position: relative; width: 44px; height: 44px; display: grid; place-items: center;">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="#f59e0b" opacity="0.16">
              <path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1.2-.4-2-.4-2 2.4 1.4 3.4 3.4 3.4 5.5A6 6 0 0 1 6 14.5C6 9 12 8 12 2z"></path>
            </svg>
            <div class="num" style="position: absolute; font-size: 17px; font-weight: 700; color: #f59e0b;">12</div>
          </div>
          <div class="lab" style="font-size: 11px;">Dage</div>
        </div>

        <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="lab" style="color: #6b7280;">M</div>
            <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #f59e0b; color: #1a1206; font-size: 13px; font-weight: 700; display: grid; place-items: center;">18</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="lab" style="color: #6b7280;">T</div>
            <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #f59e0b; color: #1a1206; font-size: 13px; font-weight: 700; display: grid; place-items: center;">19</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="lab" style="color: #6b7280;">O</div>
            <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #1f222a; color: #6b7280; font-size: 13px; font-weight: 550; display: grid; place-items: center;">20</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="lab" style="color: #6b7280;">T</div>
            <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #f59e0b; color: #1a1206; font-size: 13px; font-weight: 700; display: grid; place-items: center;">21</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="lab" style="color: #f2f3f5;">F</div>
            <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #08090c; border: 2px solid #f59e0b; color: #f2f3f5; font-size: 13px; font-weight: 700; display: grid; place-items: center;">22</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="lab" style="color: #6b7280;">L</div>
            <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #1f222a; color: #6b7280; font-size: 13px; font-weight: 550; display: grid; place-items: center;">23</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="lab" style="color: #6b7280;">S</div>
            <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #1f222a; color: #6b7280; font-size: 13px; font-weight: 550; display: grid; place-items: center;">24</div>
          </div>
        </div>
      </div>
    </div>

    <!-- NAERMESTE ACHIEVEMENT -->
    <div style="background: #14161b; border: 1px solid #23262f; border-radius: 22px; padding: 20px; display: flex; align-items: center; gap: 16px;">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(150deg, #1f222a, #14161b); border: 1px solid #2a2e38; display: grid; place-items: center; font-size: 24px; flex-grow: 0;">🍺</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <div style="font-size: 17px; font-weight: 550; letter-spacing: -0.01em;">Obeerma</div>
          <div class="num" style="font-size: 13px; color: #9ba1ad;">7 / 10</div>
        </div>
        <div style="height: 6px; border-radius: 999px; background: #23262f; position: relative; overflow: hidden;">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 999px; background: #34d399;"></div>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
    </div>

    <!-- LIVSTID -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 4px 4px 0 4px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="lab">Point</div>
        <div class="num" style="font-size: 28px; font-weight: 700;">1.284</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="lab">Længste</div>
        <div class="num" style="font-size: 28px; font-weight: 700;">31</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div class="lab">Check ins</div>
        <div class="num" style="font-size: 28px; font-weight: 700;">96</div>
      </div>
    </div>

  </div>

  <!-- FLYDENDE NAV -->
  <div style="padding: 0 16px 16px 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 8px; border-radius: 999px; background: #14161b; border: 1px solid #23262f; box-shadow: 0 12px 32px rgb(0 0 0 / 0.5);">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 68px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <div class="lab" style="font-size: 11px; letter-spacing: 0.04em;">Kanal</div>
      </div>

      <div style="width: 56px; height: 56px; border-radius: 999px; background: linear-gradient(160deg, #f59e0b, #d97706); display: grid; place-items: center; box-shadow: 0 6px 20px rgb(245 158 11 / 0.45);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 68px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        <div class="lab" style="font-size: 11px; letter-spacing: 0.04em; color: #f2f3f5;">Mig</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
