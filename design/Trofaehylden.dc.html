<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: #1B4D3E; } a:hover { color: #123528; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #676B63; }
    .badge { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; background: #FCFAF5; border: 1px solid #E3DDD0; border-radius: 14px; }
    .maerkat { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F2EEE4; overflow: hidden; position: relative;">
  <div style="position: absolute; inset: 0; background: rgb(26 28 25 / 0.42);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: #F2EEE4; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 40px rgb(26 28 25 / 0.22); display: flex; flex-direction: column;">

    <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 0 0 0;">
      <div style="width: 38px; height: 4px; border-radius: 999px; background: #DDD6C7;"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 12px 20px;">
      <div style="flex-grow: 1; font-size: 17px; font-weight: 550; letter-spacing: -0.01em; color: #1A1C19;">Trofæhylden</div>
      <div style="width: 44px; height: 44px; border-radius: 999px; background: #FCFAF5; display: grid; place-items: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6660" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </div>
    </div>

    <div style="flex-grow: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 16px;">

      <!-- hylden: ring + antal -->
      <div style="background: #1B4D3E; border-radius: 22px; padding: 20px; display: flex; align-items: center; gap: 20px; color: #F4F1E9;">
        <div style="position: relative; width: 88px; height: 88px; display: grid; place-items: center; flex-grow: 0;">
          <svg width="88" height="88" viewBox="0 0 88 88">
            <circle cx="44" cy="44" r="38" fill="none" stroke="rgb(255 255 255 / 0.18)" stroke-width="8"></circle>
            <circle cx="44" cy="44" r="38" fill="none" stroke="#F4F1E9" stroke-width="8" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="105" transform="rotate(-90 44 44)"></circle>
          </svg>
          <div class="num" style="position: absolute; font-size: 28px; font-weight: 700;">14</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <div class="lab" style="color: #A8C4B4;">Låst op</div>
          <div style="font-size: 17px; font-weight: 550; letter-spacing: -0.01em;">14 af 32 trofæer</div>
          <div style="font-size: 13px; color: #A8C4B4; line-height: 1.5;">Nogle kan tages igen. Tallet på badgen viser hvor mange gange.</div>
        </div>
      </div>

      <!-- taettest paa -->
      <div style="background: #FCFAF5; border: 1px solid #E3DDD0; border-radius: 22px; padding: 20px; display: flex; align-items: center; gap: 16px;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: #DCE8E0; display: grid; place-items: center; font-size: 24px;">🍺</div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
          <div class="lab">Tættest på</div>
          <div style="font-size: 17px; font-weight: 550; letter-spacing: -0.01em; color: #1A1C19;">Obeerma</div>
          <div style="height: 6px; border-radius: 999px; background: #E7E2D6; position: relative; overflow: hidden;">
            <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 999px; background: #1B4D3E;"></div>
          </div>
        </div>
        <div class="num" style="font-size: 13px; color: #5F6660;">7/10</div>
      </div>

      <!-- gitteret -->
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">

        <div class="badge">
          <div style="width: 64px; height: 64px; border-radius: 14px; background: #DCE8E0; display: grid; place-items: center; font-size: 32px; position: relative;">
            🍺
            <div class="num" style="position: absolute; right: -4px; top: -4px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px; background: #1B4D3E; color: #F4F1E9; font-size: 11px; font-weight: 700; display: grid; place-items: center;">×3</div>
          </div>
          <div style="font-size: 13px; font-weight: 550; color: #1A1C19; text-align: center;">Obeerma</div>
          <div class="maerkat" style="background: #DCE8E0; color: #1B4D3E;">Optjent</div>
        </div>

        <div class="badge">
          <div style="width: 64px; height: 64px; border-radius: 14px; background: #DCE8E0; display: grid; place-items: center; font-size: 32px;">🌍</div>
          <div style="font-size: 13px; font-weight: 550; color: #1A1C19; text-align: center;">Mr Worldwide</div>
          <div class="maerkat" style="background: #DCE8E0; color: #1B4D3E;">Optjent</div>
        </div>

        <div class="badge">
          <div style="width: 64px; height: 64px; border-radius: 14px; background: #DCE8E0; display: grid; place-items: center; font-size: 32px;">🚬</div>
          <div style="font-size: 13px; font-weight: 550; color: #1A1C19; text-align: center;">Puff Minister</div>
          <div class="maerkat" style="background: #DCE8E0; color: #1B4D3E;">Optjent</div>
        </div>

        <div class="badge" style="background: #EFEBE1; border-color: #E7E1D4;">
          <div style="width: 64px; height: 64px; border-radius: 14px; background: #E5E0D4; display: grid; place-items: center; font-size: 32px; opacity: 0.4;">🏃</div>
          <div style="font-size: 13px; font-weight: 550; color: #8B8F87; text-align: center;">Full Bender</div>
          <div class="maerkat" style="background: #E5E0D4; color: #8B8F87;">3 igen</div>
        </div>

        <div class="badge" style="background: #EFEBE1; border-color: #E7E1D4;">
          <div style="width: 64px; height: 64px; border-radius: 14px; background: #E5E0D4; display: grid; place-items: center; font-size: 32px; opacity: 0.4;">👑</div>
          <div style="font-size: 13px; font-weight: 550; color: #8B8F87; text-align: center;">Kongen</div>
          <div class="maerkat" style="background: #E5E0D4; color: #8B8F87;">Tildeles</div>
        </div>

        <div class="badge" style="background: #EFEBE1; border-color: #E7E1D4;">
          <div style="width: 64px; height: 64px; border-radius: 14px; background: #E5E0D4; display: grid; place-items: center; font-size: 32px; opacity: 0.4;">🌅</div>
          <div style="font-size: 13px; font-weight: 550; color: #8B8F87; text-align: center;">Solopgang</div>
          <div class="maerkat" style="background: #E5E0D4; color: #8B8F87;">Tildeles</div>
        </div>

      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
