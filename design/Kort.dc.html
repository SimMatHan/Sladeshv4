<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: #1B4D3E; } a:hover { color: #123528; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .lab { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #6E7269; }
    .naal { position: absolute; width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; font-size: 17px; border: 2px solid #FCFAF5; box-shadow: 0 2px 8px rgb(26 28 25 / 0.25); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F2EEE4; color: #1A1C19; overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 8px 16px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em;">Ballade</div>
      <div style="font-size: 13px; color: #6E7269;">4 deler position</div>
    </div>
  </div>

  <div style="display: flex; gap: 4px; margin: 12px 16px 16px 16px; padding: 4px; background: #E9E4D8; border-radius: 999px;">
    <div style="flex-grow: 1; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; color: #6E7269;">Stilling</div>
    <div style="flex-grow: 1; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; color: #6E7269;">Chat</div>
    <div style="flex-grow: 1; height: 40px; border-radius: 999px; background: #FCFAF5; display: grid; place-items: center; font-size: 13px; font-weight: 550; box-shadow: 0 1px 2px rgb(26 28 25 / 0.08);">Kort</div>
    <div style="flex-grow: 1; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; color: #6E7269;">Historik</div>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">

    <!-- kortfladen -->
    <div style="position: relative; height: 452px; border-radius: 22px; overflow: hidden; border: 1px solid #E3DDD0;">
      <svg width="358" height="452" viewBox="0 0 358 452" style="display: block;">
        <rect width="358" height="452" fill="#EFEBE2"></rect>
        <path d="M0 300 L120 250 L240 290 L358 240 L358 452 L0 452 Z" fill="#DCE6EC"></path>
        <path d="M30 60 L150 40 L190 130 L70 160 Z" fill="#DFE8D9"></path>
        <path d="M215 70 L330 90 L320 190 L230 175 Z" fill="#DFE8D9"></path>
        <path d="M60 200 L200 215 L185 275 L50 260 Z" fill="#DFE8D9"></path>
        <g stroke="#FCFAF5" stroke-width="9" fill="none" stroke-linecap="round">
          <path d="M-10 190 L370 170"></path>
          <path d="M200 -10 L215 300"></path>
          <path d="M-10 95 L180 60 L370 110"></path>
        </g>
        <g stroke="#E4DFD3" stroke-width="2" fill="none">
          <path d="M-10 250 L370 235"></path>
          <path d="M90 -10 L100 300"></path>
          <path d="M290 -10 L300 260"></path>
        </g>
      </svg>

      <!-- beacon -->
      <div style="position: absolute; left: 196px; top: 96px; width: 108px; height: 108px; border-radius: 999px; background: rgb(179 58 40 / 0.16); border: 1px solid rgb(179 58 40 / 0.5);"></div>

      <!-- naale -->
      <div class="naal" style="left: 232px; top: 132px; background: linear-gradient(150deg, #2D6A4F, #1B4D3E);">🐙</div>
      <div class="naal" style="left: 118px; top: 92px; background: linear-gradient(150deg, #3B6EA8, #1F4E79);">🦅</div>
      <div class="naal" style="left: 96px; top: 224px; background: linear-gradient(150deg, #8E5FBF, #5B3A87);">🐝</div>
      <div class="naal" style="left: 176px; top: 236px; background: #1B4D3E; width: 46px; height: 46px; font-size: 20px; border: 3px solid #FCFAF5;">🦈</div>

      <!-- flydende knapper -->
      <div style="position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 10px;">
        <div style="width: 46px; height: 46px; border-radius: 999px; background: #FCFAF5; display: grid; place-items: center; box-shadow: 0 4px 14px rgb(26 28 25 / 0.20);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B4D3E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 19-9-9 19-2-8z"></path></svg>
        </div>
        <div style="width: 46px; height: 46px; border-radius: 999px; background: #FCFAF5; display: grid; place-items: center; box-shadow: 0 4px 14px rgb(26 28 25 / 0.20);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F6660" stroke-width="1.9" stroke-linecap="round"><path d="M4 8h16M4 16h16"></path><circle cx="9" cy="8" r="2.4" fill="#FCFAF5"></circle><circle cx="15" cy="16" r="2.4" fill="#FCFAF5"></circle></svg>
        </div>
      </div>

      <div style="position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: #7C8078; background: rgb(252 250 245 / 0.85); padding: 3px 8px; border-radius: 999px;">© OpenStreetMap</div>
    </div>

    <!-- status -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #DCE8E0; border-radius: 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B4D3E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <div style="font-size: 15px; font-weight: 550; color: #1B4D3E;">Din position deles med Kanalen</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; border: 1px solid #E3DDD0; background: #FCFAF5; font-size: 15px; color: #1A1C19;">Meld dig ud</div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 16px 16px 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 8px; border-radius: 999px; background: #FCFAF5; border: 1px solid #E3DDD0; box-shadow: 0 8px 24px rgb(26 28 25 / 0.10);">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 68px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B4D3E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <div class="lab" style="letter-spacing: 0.04em; color: #1A1C19;">Kanal</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 68px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B8F87" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h4V10H3zM10 20h4V4h-4zM17 20h4v-7h-4z"></path></svg>
        <div class="lab" style="letter-spacing: 0.04em;">Stilling</div>
      </div>
      <div style="width: 56px; height: 56px; border-radius: 999px; background: #1B4D3E; display: grid; place-items: center; box-shadow: 0 6px 18px rgb(27 77 62 / 0.35);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F4F1E9" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 68px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B8F87" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <div class="lab" style="letter-spacing: 0.04em;">Chat</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 68px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B8F87" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        <div class="lab" style="letter-spacing: 0.04em;">Mig</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
